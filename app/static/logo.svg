<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0B1A36"/>
      <stop offset="60%" stop-color="#060C1B"/>
      <stop offset="100%" stop-color="#03060E"/>
    </radialGradient>

    <!-- Neon Cyan Glow Filters -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Neon Pink Glow Filters -->
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Neon Gradients for M -->
    <linearGradient id="neonLeft" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="25%" stop-color="#00E5FF"/>
      <stop offset="70%" stop-color="#0088FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="neonRight" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0077"/>
      <stop offset="40%" stop-color="#FF1493"/>
      <stop offset="80%" stop-color="#E02479"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <!-- 3D R Gradients -->
    <linearGradient id="rFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3399"/>
      <stop offset="100%" stop-color="#D91672"/>
    </linearGradient>

    <linearGradient id="rSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#990B4C"/>
      <stop offset="100%" stop-color="#550028"/>
    </linearGradient>

    <!-- Sunglasses Dark Lens Gradient -->
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2430"/>
      <stop offset="45%" stop-color="#0D111A"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="500" height="500" rx="48" fill="url(#bgGlow)"/>

  <!-- Subtle grid & vignette lines -->
  <circle cx="250" cy="240" r="210" fill="none" stroke="#00E5FF" stroke-opacity="0.05" stroke-width="1.5"/>
  <circle cx="250" cy="240" r="140" fill="none" stroke="#FF0077" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- ========================================================= -->
  <!-- MANDOROS NEON "M" (Left Half - Cyan/Blue + Hook with Barb) -->
  <!-- ========================================================= -->
  <g filter="url(#glowCyan)">
    <!-- Cyan Tube Outer Glow -->
    <path d="M 125,108 
             Q 115,102 105,108 
             L 135,270 
             Q 135,320 95,365 
             Q 55,405 60,430 
             Q 70,455 110,445 
             Q 155,430 175,375 
             L 175,340 
             L 155,370" 
          fill="none" stroke="#00E5FF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

    <!-- Cyan Tube Sharp Barb & Hook -->
    <path d="M 135,115 
             L 135,285 
             C 135,365 50,385 62,430 
             C 72,458 135,465 170,390 
             L 170,335 
             L 142,375" 
          fill="none" stroke="#00F5D4" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left Diagonal to Center Joint -->
    <path d="M 135,115 L 246,218" 
          fill="none" stroke="url(#neonLeft)" stroke-width="14" stroke-linecap="round"/>

    <!-- White Core for Neon Realism -->
    <path d="M 135,120 L 135,285 C 135,360 60,380 70,425 C 78,450 130,455 165,385 L 165,340 L 146,370" 
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <path d="M 135,120 L 244,217" 
          fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Center Joint Node -->
    <circle cx="248" cy="220" r="13" fill="#00E5FF" opacity="0.5"/>
    <circle cx="248" cy="220" r="8" fill="#FFFFFF"/>
  </g>

  <!-- ========================================================= -->
  <!-- MANDOROS NEON "M" (Right Half - Magenta/Pink Hook + 3D "R")-->
  <!-- ========================================================= -->
  <g filter="url(#glowPink)">
    <!-- Right Diagonal from Center Joint -->
    <path d="M 250,220 L 360,115" 
          fill="none" stroke="url(#neonRight)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 252,219 L 360,117" 
          fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Right Leg into Hook that catches the R -->
    <path d="M 360,115 
             L 360,285 
             C 360,350 405,345 425,380 
             C 445,420 400,450 365,420 
             C 345,405 348,375 365,368 
             L 395,368" 
          fill="none" stroke="#FF007F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- White Core for Right Neon Tube -->
    <path d="M 360,120 L 360,285 C 360,345 400,342 420,378 C 438,414 398,442 368,416 C 352,403 355,378 368,372 L 392,372" 
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- 3D Beveled Letter "R" (Caught by the Hook) -->
  <g id="letterR">
    <!-- 3D Extrusion Depth Layers -->
    <path d="M 345,340 L 390,340 C 412,340 422,352 422,368 C 422,382 412,392 396,396 L 420,445 L 396,445 L 375,402 L 360,402 L 360,445 L 340,445 Z" 
          fill="url(#rSide)" transform="translate(6, 6)"/>

    <!-- Front Face of R -->
    <path d="M 340,335 L 386,335 C 408,335 418,347 418,363 C 418,377 408,387 392,391 L 416,440 L 392,440 L 371,397 L 358,397 L 358,440 L 340,440 Z 
             M 358,351 L 358,381 L 382,381 C 392,381 398,375 398,366 C 398,357 392,351 382,351 Z" 
          fill="url(#rFront)" stroke="#FF85C0" stroke-width="2.5"/>

    <!-- Neon Rim Glint on R -->
    <path d="M 342,337 L 386,337 C 404,337 414,346 414,363" 
          fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Hook Tip Penetrating/Locking into R's Hole -->
  <path d="M 368,368 L 396,368" 
        stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" filter="url(#glowPink)"/>

  <!-- ========================================================= -->
  <!-- ICONIC SLEEK BLACK SUNGLASSES ON THE LETTER "M" ("BLIND") -->
  <!-- ========================================================= -->
  <g id="sleekSunglasses" transform="translate(0, 5)">
    <!-- Sunglasses Cast Shadow / Ambient Occlusion -->
    <ellipse cx="248" cy="158" rx="150" ry="38" fill="#000000" opacity="0.75" filter="blur(8px)"/>

    <!-- Sunglasses Outer Dark Frame & Wrap-around Temples -->
    <path d="M 98,142 
             C 112,134 165,128 248,131 
             C 331,128 384,134 398,142 
             C 404,146 395,160 382,165 
             C 362,172 345,178 322,178 
             C 285,178 268,162 258,162 
             C 248,162 238,162 228,162 
             C 218,162 201,178 164,178 
             C 141,178 124,172 104,165 
             C 91,160 92,146 98,142 Z" 
          fill="#0B0E14" stroke="#1F2937" stroke-width="4"/>

    <!-- Left Polarized Lens -->
    <path d="M 122,142 
             C 148,138 212,139 232,144 
             C 236,155 230,166 215,171 
             C 192,177 150,175 128,168 
             C 118,164 116,150 122,142 Z" 
          fill="url(#lensGlass)" stroke="#38BDF8" stroke-width="1.8" stroke-opacity="0.8"/>

    <!-- Right Polarized Lens -->
    <path d="M 374,142 
             C 348,138 284,139 264,144 
             C 260,155 266,166 281,171 
             C 304,177 346,175 368,168 
             C 378,164 380,150 374,142 Z" 
          fill="url(#lensGlass)" stroke="#EC4899" stroke-width="1.8" stroke-opacity="0.8"/>

    <!-- Aerodynamic Bridge -->
    <path d="M 233,144 Q 248,140 263,144" 
          fill="none" stroke="#4B5563" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Glossy Specular Reflection Slits (Left Lens) -->
    <path d="M 135,145 L 180,143 L 155,168 L 130,168 Z" 
          fill="#FFFFFF" opacity="0.32"/>
    <circle cx="218" cy="148" r="2.5" fill="#FFFFFF" opacity="0.6"/>

    <!-- Glossy Specular Reflection Slits (Right Lens) -->
    <path d="M 295,144 L 340,143 L 315,168 L 290,168 Z" 
          fill="#FFFFFF" opacity="0.32"/>
    <circle cx="358" cy="148" r="2.5" fill="#FFFFFF" opacity="0.6"/>

    <!-- Frame Top Highlight -->
    <path d="M 130,135 Q 248,128 366,135" 
          fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  </g>
</svg>
